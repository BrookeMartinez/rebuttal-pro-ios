workflows:
  ios-app-store:
    name: iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic
    environment:
      groups:
        - certificate_credentials
      vars:
        BUNDLE_ID: "com.crestimpact.rebuttalpro"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install CocoaPods dependencies (if the project uses any)
        script: |
          find . -name "Podfile" -execdir pod install \;

      - name: Set up keychain to use for code signing
        script: |
          keychain initialize

      - name: Fetch signing files (creates certificate + provisioning profile automatically)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      - name: Set up code signing settings on Xcode project
        script: |
         xcode-project use-profiles --archive-method app-store --code-signing-setup-verbose-logging

      - name: Build ipa for distribution
        script: |
          WORKSPACE=$(find . -name "*.xcworkspace" -not -path "*/Pods/*" | head -1)
          SCHEME=$(find . -name "*.xcscheme" -not -path "*/Pods/*" | head -1 | xargs -I{} basename {} .xcscheme)
          echo "Building workspace: $WORKSPACE"
          echo "Building scheme: $SCHEME"
          xcode-project build-ipa --workspace "$WORKSPACE" --scheme "$SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
      email:
        recipients:
          - brooke@helpyouproperty.com
        notify:
          success: true
          failure: true
